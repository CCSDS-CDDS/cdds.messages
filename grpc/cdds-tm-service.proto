syntax = "proto3";
package ccsds.cdds.v1.tm; 
import "telemetry.proto";
import "types.proto";
import "cdds-service-provider.proto";


/**
 * This is the gRPC definition of the CDDS TM Service returning TM frames received 
 * from the space link.
 */
service TmServiceProvider {

    /**
     * Returns a list of endpoints authorized for an authenticated user.
     */
    rpc getEndpoints(NoArg) returns (TmServiceEndpointList);

    /**
     * Opens a TM endpoint: A stream to receive TM frames according to the
     *  provided Quality or GvcId.
     * The returned stream will receive the TM frames of the provided Quality or GvcId
     * and synchronous notifications.
     *
     * The requested TmQoS is provided by the user per TM stream
     *
     * The service requires the following metadata when calling the service method:
     *      1) tm-endpoint-bin = JSON encoded TmServiceEndpoint using the binary marshaller
     * The tm-endpoint-bin is authorized for the authenticated user. If not authorized,
     * the method call will fail.
     */ 
    rpc openTelemetryEndpoint(NoArg) returns (stream TelemetryMessage); 
}

/**
 * Allows the identification of a service endpoint in terms
 * of the parameters provided below.
 */
message TmServiceEndpoint {

    /**
     * An optional endpoint name to distinguish endpoints;
     * for instance for spacecrafts supporting multiple bands.
     */
    optional string endpointName = 1;

    /**
     * The CDDS service version of this service
     */
    uint32 serviceVersion = 10;

    /**
     * The name of the service provider organization providing the TM service
     */
    string serviceProvider = 20;

    /**
     * The terminal providing the TM service
     */
    optional string terminal = 30;

    /**
     * The serviceUser (spacecraft) for which TM shall be delivered
     */
    string serviceUser = 40;
    
    /**
     * The Frame quality or the GVCID of the exchanged TM.
     * Requested GVCIDs shall be checked against provided GVCIDs.
     * If the check is successful, the requested GVCID(s) shall be provided.
     */
    oneof qualityOrGvcId {
        FrameQuality frameQuality = 50;

        GvcIdList gvcIds = 60;
    }

    /**
     * The QoS used for the provisioning of telemetry messages
     */
    EnumQoS qos = 70;
}

/**
 * The configuration of a telemetry service shared between user and provider.
 */
message TmServiceConfiguration {
    
    /**
     * Address or DNS name of the gRPC server hosting the CDDS TM Service Provider.
     * The IP address configuration is only needed for the CDDS TM Service User.
     */
    ServiceProviderAddress gRpcServer = 1;

    /**
     * Configuration of TM service endpoints in terms of frame quality or global virtual channel identifier. Optionally provider and ground station names can be included.
     * Note: The service user can also use the getEndpoints method to discover services at runtime.
     */
    TmServiceEndpointList endpoints = 10;
}

/**
 * List of endpoints
 */
message TmServiceEndpointList {

    /**
     * The list of endpoints
     */ 
    repeated TmServiceEndpoint endpoints = 1;
} 

