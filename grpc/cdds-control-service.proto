syntax = "proto3";
package ccsds.cdds.v1.control;
import "types.proto"; 
import "control.proto";
import "cdds-service-provider.proto";

/**
 * This is the gRPC definition of the CDDS Control Service to invoke ground station control directives.
 */
service ControlServiceProvider {

    /**
     * Returns a list of endpoints authorized for an authenticated user.
     */
    rpc getEndpoints(NoArg) returns (ControlServiceEndpointList);
   
    /**
     * Opens a control service endpoint: a bi-directional stream to send control directives and receive directive reports.
     * 
     * The returned directive reports provide information about directive request acceptance, 
     * directive execution and execution failures.
     * 
     * The service requires the following metadata when calling the service method:<br/><br/>
     *      1) control-endpoint-bin = JSON encoded ControlServiceEndpoint using the binary marshaller<br/><br/>
     *
     * The control service endpoint is authorized for the authenticated user. If not authorized,
     * the method call will fail.
     */ 
    rpc openControlEndpoint(stream ControlDirective) returns (stream DirectiveReport); 
}

/**
 * Allows the identification of a service endpoint in terms
 * of the parameters provided below.
 */
message ControlServiceEndpoint {

    /**
     * An optional endpoint name to distinguish endpoints;
     * for instance for spacecrafts supporting multiple bands.
     */
    optional string endpointName = 1;

    /**
     * The CDDS service version of this service
     */
    uint32 serviceVersion = 10;

    /**
     * The name of the service provider organization providing the control service
     */
    string serviceProvider = 20;

    /**
     * The name of the terminal providing the control service
     */
    optional string terminal = 30;

    /**
     * The service user (spacecraft) for which control shall be provided
     */
    string serviceUser = 40;

    /**
     * The Object identifier list of the Functional Resource Directives available for this endpoint
     */
    repeated FunctionalResourceDirectiveName functionalResourceDirectives = 50;

    /**
     * The list of generic control directives available for this endpoint
     */
    repeated string genericDirectiveIds = 60;
}

/**
 * The configuration of a control service shared between user and provider.
 */
message ControlServiceConfiguration {
    
    /**
     * Address or DNS name of the gRPC server hosting the CDDS Control Service Provider.
     * The IP address configuration is only needed for the CDDS Control Service User.
     */
    ServiceProviderAddress gRpcServer = 1;

    /**
     * Configuration of control service endpoints denoting control directives.
     * Note: The service user can also use the getEndpoints method to discover services at runtime.
     */
    ControlServiceEndpointList endpoints = 10;
}

/**
 * List of endpoints
 */
message ControlServiceEndpointList {

    /**
     * The list of endpoints
     */ 
    repeated ControlServiceEndpoint endpoints = 1;
}

/**
 * identifies a Functional Resource Directive by OID and optionally by the instance number
 */
message FunctionalResourceDirectiveName {
    
    /**
     * The Directive Object Identifier
     */
    ObjectIdentifier functionalResourceDirective = 1;

    /**
     * The optional Functional Resource Instance number
     */
    optional uint64 functionalResourceInstance = 10;
}

